[project]
name = "invoice-extract-vlm"
version = "0.1.0"
description = "VLM-based invoice/receipt field extraction: dataset pipeline, canonical schema, baseline eval harness."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jayani" }]

dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "Pillow>=10.3",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "black>=24.4",
    "pre-commit>=3.7",
]
ocr = [
    # Phase 1: preprocessing + OCR. opencv/scikit-image do the image work;
    # pytesseract and paddleocr are thin wrappers over engines that must also
    # be installed at system level (see docs/phase1_preprocessing.md).
    #
    # Do NOT install this alongside [paddle]: paddlex pins
    # opencv-contrib-python==4.10.0.84, which unpacks into the same cv2/
    # directory as the headless wheel. pip cannot resolve that -- on Windows it
    # aborts mid-transaction with "Access is denied: cv2.pyd", leaving the env
    # half-installed. For the paddle path use [paddle] on its own; contrib
    # ships the same cv2 module preprocess/ and degrade/ import.
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "PyMuPDF>=1.24",
]
paddle = [
    # Self-sufficient: paddlex pulls opencv-contrib-python, which supplies the
    # cv2 module this code imports. See the collision note in [ocr] before
    # combining the two.
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]

demo = [
    # demo/app.py only. Deliberately not a core dependency -- schema, dataset
    # and eval work need none of it -- but `make demo` is dead without it.
    "streamlit>=1.35",
]
vlm = [
    # Heavy deps needed only for actual model inference (Colab/Kaggle), not for
    # schema/dataset/eval work. Kept optional so the core repo installs fast.
    "torch>=2.3",
    "transformers>=4.42",
    "accelerate>=0.31",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.2",
]

[project.scripts]
ie-validate-schema = "invoice_extract.data.validate:main"
ie-eval = "invoice_extract.eval.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extract"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks target Colab, not this package: different Python, different
# installed deps, and their sources are JSON-escaped so ruff misparses the
# regex literals inside them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
